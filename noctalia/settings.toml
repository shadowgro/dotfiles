[weather]
enabled = false

[widget.audio_visualizer]
bands = 48
mirrored = false
show_when_idle = true
width = 500

[widget.bar_2]
type = "yuuto/calculator:bar"

[widget.battery]
display_mode = "graphic"

[widget.bluetooth]
hide_when_adapter_off = true

[widget.brightness]
show_label = false

[widget.date]
format = "{:%d/%b}"

[widget.input_volume]
enabled = false
show_label = false

[widget.keyboard_layout]
show_glyph = false

[widget.launcher]
enabled = false

[widget.lock_keys]
display = "full"

[widget.media]
enabled = false

[widget.network]
show_label = false
vpn_status = "both"

[widget.spacer_1]
type = "spacer"

[widget.tray]
hide_passive = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
active_pill_size = 1.0
hide_when_empty = true
