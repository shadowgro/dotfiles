app_icon_colorize = true
button_borders = false
font_family = "Comfortaa Medium"
panel_anchor_bar = "my_noctalia"
polkit_agent = true
popup_shadows = false
settings_window_translucent = true
show_location = false

    [shell.greeter_sync]
