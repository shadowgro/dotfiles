config_version = 16

[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.69999998435378075

[bar]
order = [ "my_noctalia" ]

    [bar.my_noctalia]
    background_opacity = 0.29999999329447746
    border = "primary"
    capsule_fill = "on_primary"
    capsule_foreground = "primary"
    capsule_opacity = 0.29999999329447746
    center = [ "cpu", "temp", "sysmon", "network_rx", "network_tx", "ram" ]
    concave_edge_corners = true
    end = [
        "tray",
        "notifications",
        "clipboard",
        "keyboard_layout",
        "bluetooth",
        "input_volume",
        "volume",
        "power_profile",
        "battery",
        "brightness",
        "network",
        "spacer_1",
        "date",
        "spacer_1",
        "clock"
    ]
    font_family = "Maple Mono NF"
    font_weight = 700
    margin_ends = 0
    position = "bottom"
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_left = 0
    radius_top_right = 0
    scale = 1.1499999999999999
    shadow = false
    start = [
        "session",
        "control-center",
        "wallpaper",
        "widget",
        "screenshot",
        "bar",
        "spacer_1",
        "workspaces",
        "spacer_1",
        "taskbar"
    ]
    thickness = 38

[battery]
warning_threshold = 20

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.29999999329447746
border = "primary"
border_width = 2.0
concave_edge_corners = false
icon_size = 32
launcher_position = "start"
magnification_scale = 2.0
margin_edge = 4
reserve_space = false
shadow = false
show_dots = true

[idle]
behavior_order = [ "idle-behavior", "lock", "suspend", "idle", "idle-behavior-2", "idle-behavior-3" ]
pre_action_fade_seconds = 0

    [idle.behavior.idle]
    action = "command"
    command = "mmsg dispatch sleep_monitor,eDP-1"
    enabled = false
    resume_command = "mmsg dispatch wakeup_monitor,eDP-1"
    timeout = 10.0

    [idle.behavior.idle-behavior]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 300.0

    [idle.behavior.idle-behavior-2]
    action = "command"
    command = "noctalia msg session lock"
    enabled = false
    timeout = 12.0

    [idle.behavior.idle-behavior-3]
    action = "command"
    command = "systemctl suspend"
    enabled = false
    timeout = 15.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 360.0

    [idle.behavior.suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 600.0

[lockscreen]
fingerprint = false
transition_duration = 800

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.000244140625
    cy = 701.9998779296875
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 544.0
    box_width = 800.0
    cx = 960.000244140625
    cy = 428.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

[notification]
background_opacity = 0.29999999329447746
border_color = "primary"
border_width = 2.0
filter_order = [ "filter" ]
layer = "overlay"
position = "bottom_right"

[osd]
background_opacity = 0.29999999329447746
border_color = "primary"
border_width = 2.0
position = "bottom_right"

[plugin_settings."noctalia/timer"]
alarm = true
panel_placement = "floating"

[plugin_settings."oldirtty/color_picker"]

[plugins]
enabled = [ "oldirtty/color_picker", "noctalia/timer" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
